# Fork trial only. Both worker pins identify the reviewed central deployment.
# Keep this caller on the fixed deployment
# branch, not the source branch or default main.
name: Manual fork dependency release
run-name: 'Manual fork release ${{ inputs.month }}'
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Owner-approved fork execution, never automatic publication
        type: choice
        options: [execute]
        default: execute
        required: true
      month:
        description: Fixed trial month
        type: string
        default: 2026-10
        required: true
permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read
jobs:
  release:
    uses: yizha1/notation/.github/workflows/monthly-patch-worker.yml@3ae04303c134401982a0715eca0bea04ce1ffbe6
    with:
      mode: ${{ inputs.mode }}
      month: ${{ inputs.month }}
      controller_issue: '26'
      plan_id: d7a9cd8f0235aa78b2af278596a76a94f1ad38fff034bce1bfcc19800f62e9b3
      attempt: '1'
      worker_sha: 3ae04303c134401982a0715eca0bea04ce1ffbe6
    secrets:
      MONTHLY_PATCH_TOKEN: ${{ secrets.MONTHLY_PATCH_TOKEN }}
      MONTHLY_PATCH_SIGNING_KEY: ${{ secrets.MONTHLY_PATCH_SIGNING_KEY }}
