name: Fork dependency CI

on:
  push:
    branches: [monthly-patch-test-main, 'monthly-patch-test-release-*']
  pull_request:
    branches: [monthly-patch-test-main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: 'off'
  GOTOOLCHAIN: local
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  minimum:
    if: >-
      github.repository == 'yizha1/notation-core-go' ||
      github.repository == 'yizha1/notation-go' ||
      github.repository == 'yizha1/notation'
    runs-on: ubuntu-24.04
    outputs:
      go: ${{ steps.minimum.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: minimum
        name: Read the declared minimum Go minor
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          matches = re.findall(r"(?m)^go (\d+\.\d+)(?:\.\d+)?$", pathlib.Path("go.mod").read_text())
          if len(matches) != 1:
              raise SystemExit("Missing or ambiguous minimum Go directive")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("go=" + matches[0] + "\n")
          PY

  qualify:
    needs: minimum
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        go: ['${{ needs.minimum.outputs.go }}', stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - name: Install pinned qualification tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          go install github.com/apache/skywalking-eyes/cmd/license-eye@v0.9.0
      - name: Qualify dependencies with normal source tests and CVE gates
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 .github/scripts/qualify_monthly_candidate.py . \
            --repository "$REPOSITORY" --evidence "$RUNNER_TEMP/fork-ci"
      - name: Keep failure and qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fork-ci-${{ matrix.go }}
          path: ${{ runner.temp }}/fork-ci/
          if-no-files-found: warn
