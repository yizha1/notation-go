name: Fork library trial draft

on:
  push:
    tags:
      - 'v*-trial.*'

permissions:
  contents: read

jobs:
  core-dependency:
    if: github.repository == 'yizha1/notation-go' && vars.PATCH_TRIAL_ENABLED == 'true'
    runs-on: ubuntu-24.04
    env:
      GOWORK: 'off'
      CORE_BASE_VERSION: v1.3.0
      CORE_COMMIT: 03171674c94728622c5b1534b5e3396fcb468733
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          check-latest: true
      - name: Require the pinned core trial commit
        shell: bash
        run: |
          core_module=$(go list -m -json "github.com/yizha1/notation-core-go@$CORE_COMMIT")
          if ! jq -e --arg commit "$CORE_COMMIT" \
            '.Path == "github.com/yizha1/notation-core-go" and .Origin.Hash == $commit and (.Version | type == "string" and startswith("v"))' \
            <<< "$core_module" > /dev/null; then
            echo "::error::Could not resolve the pinned core trial commit $CORE_COMMIT"
            exit 1
          fi
          core_version=$(jq -r '.Version' <<< "$core_module")
          dependency=$(go list -m -f '{{.Version}} {{if .Replace}}{{.Replace.Path}}@{{.Replace.Version}}{{end}}' github.com/notaryproject/notation-core-go)
          expected="$CORE_BASE_VERSION github.com/yizha1/notation-core-go@$core_version"
          if [[ "$dependency" != "$expected" ]]; then
            echo "::error::Expected $expected; got $dependency"
            exit 1
          fi
  trial:
    needs: core-dependency
    if: github.repository == 'yizha1/notation-go' && vars.PATCH_TRIAL_ENABLED == 'true'
    permissions:
      contents: write
    uses: yizha1/notation-core-go/.github/workflows/trial-library.yml@03171674c94728622c5b1534b5e3396fcb468733
