name: Fork library trial draft

on:
  push:
    tags:
      - 'v*-trial.*'

permissions:
  contents: read

jobs:
  core-dependency:
    if: github.repository == 'yizha1/notation-go' && vars.PATCH_TRIAL_ENABLED == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          check-latest: true
      - name: Require the released core fork trial dependency
        run: |
          dependency=$(go list -m -f '{{if .Replace}}{{.Replace.Path}}@{{.Replace.Version}}{{end}}' github.com/notaryproject/notation-core-go)
          if [[ ! "$dependency" =~ ^github\.com/yizha1/notation-core-go@v[0-9]+\.[0-9]+\.[0-9]+-trial\.[1-9][0-9]*$ ]]; then
            echo "Expected a versioned core fork trial replacement, got: $dependency" >&2
            exit 1
          fi
  trial:
    needs: core-dependency
    if: github.repository == 'yizha1/notation-go' && vars.PATCH_TRIAL_ENABLED == 'true'
    permissions:
      contents: write
    uses: yizha1/notation-core-go/.github/workflows/trial-library.yml@7c17b4f96d246fb14faf764f33f2ea1894708289
